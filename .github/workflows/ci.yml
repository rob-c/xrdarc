name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  # Test against the shared clients' development heads (xrdarc also works with 0.3.2 from PyPI).
  XRDCLIENT_REF: main
  XGFALCLIENT_REF: main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rob-c/xrdclient
          ref: ${{ env.XRDCLIENT_REF }}
          path: .dependencies/xrdclient
      - uses: actions/checkout@v4
        with:
          repository: rob-c/xgfalclient
          ref: ${{ env.XGFALCLIENT_REF }}
          path: .dependencies/xgfalclient
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .dependencies/xrdclient -e .dependencies/xgfalclient -e ".[dev]"
      - run: python -m pytest -n auto --cov --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rob-c/xrdclient
          ref: ${{ env.XRDCLIENT_REF }}
          path: .dependencies/xrdclient
      - uses: actions/checkout@v4
        with:
          repository: rob-c/xgfalclient
          ref: ${{ env.XGFALCLIENT_REF }}
          path: .dependencies/xgfalclient
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .dependencies/xrdclient -e .dependencies/xgfalclient -e ".[dev,docs]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: complexipy --quiet
      - run: python -m build && twine check --strict dist/*
      - run: mkdocs build --strict
